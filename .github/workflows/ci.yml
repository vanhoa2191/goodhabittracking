name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [quality, browser]
    # Deploys of consecutive commits must not overlap: when two runs finish close together the older commit could
    # otherwise upload last and replace the newer build. Waiting runs are superseded by the newest, never cancelled mid-upload.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPERATIONS_CRON_SECRET: ${{ secrets.LIFECYCLE_CRON_SECRET }}
      NEXT_PUBLIC_APP_URL: https://app.kidhabithero.com
      NEXT_PUBLIC_MARKETING_URL: https://kidhabithero.com
      NEXT_PUBLIC_SESSION_HINT_DOMAIN: kidhabithero.com
      NEXT_PUBLIC_DEPLOY_TARGET: app
    steps:
      - id: configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: a newer commit is already on main ($latest_main); it deploys instead."
            exit 0
          fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: configure the repository secrets and variables listed in docs/deployment.md."
          fi
      - if: steps.configuration.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.configuration.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: steps.configuration.outputs.ready == 'true'
        run: npm ci
      - if: steps.configuration.outputs.ready == 'true'
        name: Wait for the matching marketing release before app deploy
        run: |
          npm run build:marketing
          npm run verify:marketing-release -- \
            --dir dist/marketing \
            --app-origin "$NEXT_PUBLIC_APP_URL" \
            --marketing-origin "$NEXT_PUBLIC_MARKETING_URL" \
            --url "$NEXT_PUBLIC_MARKETING_URL" \
            --wait-release "$GITHUB_SHA"
      - if: steps.configuration.outputs.ready == 'true'
        run: npm run deploy:cloudflare
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_HABIT_PROGRAMS: ${{ vars.NEXT_PUBLIC_HABIT_PROGRAMS }}
          NEXT_PUBLIC_DAILY_MASCOT_LETTER: ${{ vars.NEXT_PUBLIC_DAILY_MASCOT_LETTER }}
          NEXT_PUBLIC_DAILY_JOURNAL: ${{ vars.NEXT_PUBLIC_DAILY_JOURNAL }}
          NEXT_PUBLIC_DREAM_CITY: ${{ vars.NEXT_PUBLIC_DREAM_CITY }}
          NEXT_PUBLIC_PARENT_REENGAGEMENT: ${{ vars.NEXT_PUBLIC_PARENT_REENGAGEMENT }}
          NEXT_PUBLIC_EMAIL_CODE_LOGIN: ${{ vars.NEXT_PUBLIC_EMAIL_CODE_LOGIN }}
          NEXT_PUBLIC_AGE_THEME: ${{ vars.NEXT_PUBLIC_AGE_THEME }}
          NEXT_PUBLIC_DAILY_EASE: ${{ vars.NEXT_PUBLIC_DAILY_EASE }}
          NEXT_PUBLIC_INDEPENDENCE: ${{ vars.NEXT_PUBLIC_INDEPENDENCE }}
          NEXT_PUBLIC_HABIT_COACH: ${{ vars.NEXT_PUBLIC_HABIT_COACH }}
          NEXT_PUBLIC_PARENT_AI: ${{ vars.NEXT_PUBLIC_PARENT_AI }}
          NEXT_PUBLIC_LEGAL_PAGES_APPROVED: ${{ vars.NEXT_PUBLIC_LEGAL_PAGES_APPROVED }}
          SUPPORT_EMAIL: kidhabithero@gmail.com
      - if: steps.configuration.outputs.ready == 'true'
        name: Verify production health after deploy
        run: |
          # Wait until the new build answers (its version is this commit) and every dependency check passes.
          # The component checks are only returned with the operations secret.
          if [ -z "$OPERATIONS_CRON_SECRET" ]; then
            echo "OPERATIONS_CRON_SECRET is required to verify production health."
            exit 1
          fi
          expected="${GITHUB_SHA:0:12}"
          for attempt in $(seq 1 18); do
            # No --fail: a 503 body names the failing check, and the last attempt prints it.
            body="$(curl --silent --show-error --max-time 15 \
              --header "Authorization: Bearer $OPERATIONS_CRON_SECRET" \
              https://app.kidhabithero.com/api/health || true)"
            if printf '%s' "$body" | jq -e --arg version "$expected" \
              '(.status == "ready") and (.version == $version) and ((.checks | type == "object") and (.checks | length > 0) and (.checks | to_entries | all(.value == true)))' >/dev/null; then
              echo "Production is ready on $expected."
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Production did not report ready on $expected: $body"
              exit 1
            fi
            sleep 10
          done
          if [ -n "$OPERATIONS_CRON_SECRET" ]; then
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --retry-delay 5 --max-time 15 \
              --header "Authorization: Bearer $OPERATIONS_CRON_SECRET" \
              https://app.kidhabithero.com/api/internal/operations/health | \
              jq -e '.status == "ready"' >/dev/null
          fi
