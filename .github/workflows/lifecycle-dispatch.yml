name: Lifecycle dispatch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.LIFECYCLE_CRON_SECRET }}
    steps:
      - name: Check configuration
        id: configuration
        run: |
          if [ -n "$CRON_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Lifecycle dispatch skipped: configure LIFECYCLE_CRON_SECRET."
          fi
      - name: Dispatch lifecycle outbox
        if: steps.configuration.outputs.ready == 'true'
        run: |
          status=$(curl --silent --show-error --retry 2 \
            --output response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://app.kidhabithero.com/api/internal/lifecycle/dispatch)
          if [ "$status" = "409" ]; then
            echo "::warning::The app has no email provider configured, so nothing was sent. Set RESEND_API_KEY (or LIFECYCLE_EMAIL_PROVIDER=brevo with BREVO_API_KEY) and the sender variables to enable lifecycle email."
            exit 0
          fi
          if [ "$status" -ge 400 ]; then
            echo "Dispatch failed with HTTP $status"
            cat response.json
            exit 1
          fi
