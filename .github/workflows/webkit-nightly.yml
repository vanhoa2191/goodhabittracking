name: WebKit nightly

# Safari engines behave differently from Chromium for the camera and QR pairing link, the installable app (PWA),
# clipboard, storage and focus handling, and the pull-request run only covers Chromium. This runs the specs
# that touch those areas on desktop and iPhone Safari engines every night and on demand. It is not a required
# check: a red run is a reason to look, not to block a release.

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      specs:
        description: 'Spec name filters to run (space separated); empty runs the Safari-sensitive set'
        required: false
        default: ''
      projects:
        description: 'Projects as a JSON list, for example ["webkit"]'
        required: false
        default: '["webkit","mobile-safari"]'

permissions:
  contents: read

concurrency:
  group: webkit-nightly
  cancel-in-progress: true

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects || '["webkit","mobile-safari"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Run the Safari-sensitive specs
        env:
          SPECS: ${{ inputs.specs || 'pair-link activity-mutation kid-hero-compact mobile-menu mobile-dialogs header-narrow appearance habit-fire child-journal entry-journey accessibility family-data-export' }}
        run: npm run test:e2e -- --project=${{ matrix.project }} $SPECS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
