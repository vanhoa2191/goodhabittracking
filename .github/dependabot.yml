version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the pins and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # Major npm releases (TypeScript, Vitest, Node types…) are upgraded deliberately in their own branch,
  # not proposed every week; minor and patch releases still arrive grouped.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
