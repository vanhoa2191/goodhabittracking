<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>KidHabit Hero đang ngoại tuyến</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#1e293b;font:16px/1.6 system-ui,sans-serif}.card{max-width:32rem;margin:1.5rem;padding:2rem;border:1px solid #e2e8f0;border-radius:1.5rem;background:white;box-shadow:0 12px 40px #0f172a14}h1{font-size:1.6rem;line-height:1.25;margin:0 0 .75rem}button{min-height:44px;border:0;border-radius:.8rem;background:#4f46e5;color:white;padding:.7rem 1.1rem;font-weight:700}
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Hãy kết nối Internet rồi thử tải lại để nhận dữ liệu mới nhất của gia đình.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
